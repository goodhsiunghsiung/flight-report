name: Weekly flight report

on:
  schedule:
    # Every Monday 00:00 UTC = Monday 08:00 Taiwan time
    - cron: "0 0 * * 1"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

permissions:
  contents: write         # to commit price history back to the repo

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search flights and send email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python flight_report.py

      - name: Keep the HTML report as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.html
          if-no-files-found: ignore

      - name: Save price history
        run: |
          git config user.name "flight-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Price history $(date -u +%F)"
          git push
